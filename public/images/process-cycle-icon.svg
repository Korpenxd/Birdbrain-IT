<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" role="img" aria-labelledby="title desc">
  <title id="title">Process cycle</title>
  <desc id="desc">Four connected wireframe nodes forming a continuous process around a central diamond.</desc>
  <defs>
    <linearGradient id="process-gradient" x1="25" y1="30" x2="230" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4de8ff"/>
      <stop offset="0.48" stop-color="#596fff"/>
      <stop offset="1" stop-color="#f252ed"/>
    </linearGradient>
    <filter id="process-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="url(#process-gradient)" stroke-linecap="round" stroke-linejoin="round" filter="url(#process-glow)">
