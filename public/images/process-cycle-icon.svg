    <path d="M174 73L190 79L184 95M187 174L181 190L165 184M86 187L70 181L76 165M73 86L79 70L95 76" stroke-width="4.5"/>
    <polygon points="130,17 150,28 150,50 130,61 110,50 110,28" stroke-width="3"/>
    <polygon points="221,106 242,118 242,142 221,154 200,142 200,118" stroke-width="3"/>
    <polygon points="130,199 150,210 150,232 130,243 110,232 110,210" stroke-width="3"/>
    <polygon points="39,106 60,118 60,142 39,154 18,142 18,118" stroke-width="3"/>
    <path d="M120 34H140M215 121L229 130L215 139M120 221H140M32 130H46" stroke-width="2" opacity="0.85"/>
